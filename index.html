<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="F1 Tracker">
<meta name="theme-color" content="#0C0C0E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700;9..40,800&display=swap">
<title>F1 Tracker</title>
<style>
:root {
  --bg: #0C0C0E;
  --surface: #1A1A1F;
  --surface2: #222228;
  --border: #2A2A32;
  --text: #E8E8EC;
  --text2: #9B9BA3;
  --text3: #5C5C66;
  --red: #E10600;
  --red-dim: rgba(225,6,0,0.15);
  --red-glow: rgba(225,6,0,0.3);
  --gold: #FFD700;
  --silver: #C0C0C0;
  --bronze: #CD7F32;
  --font: 'DM Sans', -apple-system, 'Segoe UI', sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

.app-header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(12,12,14,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.app-logo{display:flex;align-items:center;gap:10px}
.app-logo-mark{background:var(--red);color:#fff;font-weight:800;font-size:14px;letter-spacing:1px;padding:4px 8px;border-radius:4px}
.app-logo-text{font-size:13px;color:var(--text2);font-weight:500}
.header-right{font-size:12px;color:var(--text3)}

.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:rgba(12,12,14,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;border:none;background:none;color:var(--text3);font-size:10px;font-family:var(--font);font-weight:500;transition:color .2s}
.tab-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab-item.active{color:var(--red)}
.tab-item.active svg{stroke:var(--red)}

.view{display:none;padding:16px 16px calc(70px + var(--safe-b))}
.view.active{display:block}

.hero{position:relative;background:linear-gradient(145deg,#1C0A0A 0%,var(--surface) 50%,#0A0E1C 100%);border:1px solid var(--border);border-radius:16px;padding:22px 20px;margin-bottom:20px;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:radial-gradient(circle,var(--red-glow) 0%,transparent 70%);pointer-events:none}
.hero-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--red);font-weight:700;margin-bottom:10px;position:relative}
.hero-eyebrow.live::before{content:'';display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;margin-right:6px;vertical-align:middle;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero-title{font-size:24px;font-weight:800;line-height:1.15;margin-bottom:4px;text-wrap:balance}
.hero-sub{font-size:13px;color:var(--text2);margin-bottom:16px}
.hero-countdown{font-size:36px;font-weight:800;color:var(--red);line-height:1}
.hero-countdown small{font-size:12px;color:var(--text3);font-weight:500;margin-right:2px}
.hero-race-time{font-size:12px;color:var(--text2);margin-top:8px}

.sessions-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:16px}
.session-chip{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.session-chip .label{font-size:11px;color:var(--text3);font-weight:500}
.session-chip .time{font-size:12px;font-weight:700}

.section-head{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.race-list{display:flex;flex-direction:column;gap:6px}
.race-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;transition:border-color .2s}
.race-row.past{opacity:.3}
.race-row.live{border-color:var(--red);box-shadow:0 0 12px var(--red-dim)}
.race-round{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;background:var(--surface2);color:var(--text2)}
.race-row.live .race-round,.race-row:not(.past) .race-round{background:var(--red);color:#fff}
.race-info{flex:1;min-width:0}
.race-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race-circuit{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race-date{text-align:right;flex-shrink:0}
.race-date .d{font-weight:700;font-size:13px}
.race-date .t{font-size:11px;color:var(--text3)}
.live-pill{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0;animation:pulse 1.5s infinite}

.track-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px}
.track-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.track-title{font-size:15px;font-weight:700}
.track-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.track-status.on{background:var(--red);color:#fff;animation:pulse 1.5s infinite}
.track-status.off{background:var(--surface2);color:var(--text3)}
.track-canvas-box{position:relative;width:100%;aspect-ratio:4/3}
#trackCanvas{width:100%;height:100%;display:block}

.lap-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
.lap-bar strong{color:var(--red);font-weight:700}

.lb-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.lb-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.lb-header .refresh-dot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
.lb-header .refresh-dot.live{background:#00C853;animation:pulse 1.5s infinite}
.lb-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(42,42,50,0.5);font-size:13px}
.lb-row:last-child{border-bottom:none}
.lb-pos{width:22px;font-weight:800;font-size:14px;text-align:center;flex-shrink:0}
.lb-pos.p1{color:var(--gold)}.lb-pos.p2{color:var(--silver)}.lb-pos.p3{color:var(--bronze)}
.lb-color{width:3px;height:26px;border-radius:2px;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-name{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-team{font-size:10px;color:var(--text3)}
.lb-gap{font-size:11px;color:var(--text2);text-align:right;min-width:50px}

.standings-toggle{display:flex;gap:0;margin-bottom:14px;background:var(--surface);border-radius:10px;padding:3px;border:1px solid var(--border)}
.standings-toggle button{flex:1;padding:8px;border:none;background:none;font-family:var(--font);font-size:13px;font-weight:600;color:var(--text3);border-radius:8px;cursor:pointer;transition:all .2s}
.standings-toggle button.active{background:var(--red);color:#fff}
.st-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.st-pos{width:28px;font-weight:800;font-size:16px;text-align:center;flex-shrink:0}
.st-pos.p1{color:var(--gold)}.st-pos.p2{color:var(--silver)}.st-pos.p3{color:var(--bronze)}
.st-color{width:3px;height:30px;border-radius:2px;flex-shrink:0}
.st-info{flex:1;min-width:0}
.st-driver{font-weight:700;font-size:14px}
.st-team{font-size:11px;color:var(--text3);margin-top:1px}
.st-points{font-weight:800;font-size:16px;color:var(--red);flex-shrink:0}
.st-points small{font-size:10px;color:var(--text3);font-weight:500}

.setting-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:6px}
.setting-label{font-size:14px;font-weight:600}
.setting-desc{font-size:11px;color:var(--text3);margin-top:2px}

/* Tire compounds */
.tire{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid;flex-shrink:0;margin-left:auto}
.tire.SOFT{border-color:#E10600;background:rgba(225,6,0,0.2)}
.tire.MEDIUM{border-color:#FFD700;background:rgba(255,215,0,0.2)}
.tire.HARD{border-color:#E8E8EC;background:rgba(232,232,236,0.15)}
.tire.INTERMEDIATE{border-color:#00C853;background:rgba(0,200,83,0.2)}
.tire.WET{border-color:#00B0FF;background:rgba(0,176,255,0.2)}
.lb-row .dnf-tag{font-size:9px;color:var(--red);font-weight:700;margin-left:auto}

/* Event toast */
.event-toast-container{position:absolute;top:10px;left:10px;right:10px;z-index:10;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.event-toast{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;animation:toastIn .3s ease-out,toastOut .5s 3s ease-in forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-toast.pit{background:rgba(255,255,255,0.1);color:var(--text);backdrop-filter:blur(8px)}
.event-toast.yellow{background:rgba(255,215,0,0.25);color:#FFD700;border:1px solid rgba(255,215,0,0.3)}
.event-toast.red{background:rgba(225,6,0,0.25);color:#ff4444;border:1px solid rgba(225,6,0,0.3)}
.event-toast.sc{background:rgba(255,165,0,0.2);color:#FFA500;border:1px solid rgba(255,165,0,0.3)}
.event-toast.dnf{background:rgba(225,6,0,0.15);color:var(--red);border:1px solid rgba(225,6,0,0.2)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* Flag overlay */
.flag-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;border-radius:0 0 16px 16px;transition:background .5s}
.flag-overlay.yellow{background:rgba(255,215,0,0.06)}
.flag-overlay.red{background:rgba(225,6,0,0.08)}
.flag-overlay.sc{background:rgba(255,165,0,0.06)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

@media(min-width:600px){
  .view{max-width:480px;margin:0 auto}
  .hero-title{font-size:28px}
  .sessions-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-logo">
    <div class="app-logo-mark">F1</div>
    <div class="app-logo-text">2026 賽季</div>
  </div>
  <div class="header-right">台灣時間</div>
</div>

<div class="view active" id="v-schedule">
  <div class="hero" id="heroBanner"></div>
  <div class="section-head">全部賽事</div>
  <div class="race-list" id="raceList"></div>
</div>

<div class="view" id="v-track">
  <div class="track-wrap">
    <div class="track-top">
      <div class="track-title" id="trackTitle">賽道回放</div>
      <div class="track-status off" id="trackStatus">載入中</div>
    </div>
    <div class="lap-bar"><span id="lapText">等待中</span><strong id="lapNum"></strong></div>
    <div id="replayBar" style="display:none;padding:8px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
      <div style="flex:1;background:var(--surface2);height:4px;border-radius:2px;overflow:hidden;position:relative">
        <div id="replayProgress" style="height:100%;background:var(--red);width:0%;border-radius:2px;transition:width .3s"></div>
      </div>
      <span id="replayTime" style="font-size:11px;color:var(--text3);min-width:40px;text-align:right">0%</span>
    </div>
    <div class="track-canvas-box">
      <canvas id="trackCanvas"></canvas>
      <div class="flag-overlay" id="flagOverlay"></div>
      <div class="event-toast-container" id="toastContainer"></div>
    </div>
  </div>
  <div class="lb-card">
    <div class="lb-header">
      <span>即時排行</span>
      <div class="refresh-dot" id="refreshDot"></div>
    </div>
    <div id="leaderboard"></div>
  </div>
</div>

<div class="view" id="v-standings">
  <div class="standings-toggle">
    <button class="active" onclick="showStandings('driver')">車手榜</button>
    <button onclick="showStandings('team')">車隊榜</button>
  </div>
  <div id="standingsBody"></div>
</div>

<div class="view" id="v-more">
  <div class="section-head" style="margin-bottom:14px">設定</div>
  <div class="setting-row">
    <div><div class="setting-label">通知提醒</div><div class="setting-desc">比賽前 1 小時推播通知</div></div>
    <button class="notify-btn" id="notifyBtn" onclick="toggleNotify()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:8px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer">開啟通知</button>
  </div>
  <div style="text-align:center;padding:40px 0;color:var(--text3);font-size:12px">
    F1 Tracker v2.0<br>即時資料來自 OpenF1 API<br>積分資料來自 Ergast API
  </div>
</div>

<div class="tab-bar">
  <button class="tab-item active" data-view="v-schedule">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    賽程
  </button>
  <button class="tab-item" data-view="v-track">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3c-2 3-2 6 0 9s2 6 0 9"/><path d="M3 12h18"/></svg>
    賽道
  </button>
  <button class="tab-item" data-view="v-standings">
    <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 22V2h4v20"/><rect x="6" y="14" width="4" height="8"/><rect x="14" y="10" width="4" height="12"/></svg>
    積分
  </button>
  <button class="tab-item" data-view="v-more">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4m-8.66-3.34 2.83-2.83m11.66-5.66 2.83-2.83M1 12h4m14 0h4m-3.34 8.66-2.83-2.83M6.17 6.17 3.34 3.34"/></svg>
    更多
  </button>
</div>

    const d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4),s=Math.floor(diff%6e4/1e3);

}

// ==================== REPLAY SYSTEM ====================
let tCanvas,tCtx,animId=null;
let replayData=null;
const REPLAY_DURATION=300;

function getP(pts,t){
  t=((t%1)+1)%1;const n=pts.length,idx=t*n,i0=Math.floor(idx)%n,i1=(i0+1)%n,f=idx-Math.floor(idx);
  const im=(i0-1+n)%n,i2=(i1+1)%n,tt=f,t2=tt*tt,t3=t2*tt;
  function cr(a,b,c,d){return .5*((2*b)+(c-a)*tt+(2*a-5*b+4*c-d)*t2+(3*b-a-3*c+d)*t3)}
  return[cr(pts[im][0],pts[i0][0],pts[i1][0],pts[i2][0]),cr(pts[im][1],pts[i0][1],pts[i1][1],pts[i2][1])]
}

function lastCompletedRace(){
  const now=Date.now();
  let last=null;
  for(const r of RACES){ if(new Date(r.rt).getTime()+9e6<now) last=r; }
  return last;
}

// Toast system
let shownToasts=new Set();
function showToast(id,text,type){
  if(shownToasts.has(id))return;
  shownToasts.add(id);
  const c=document.getElementById('toastContainer');
  const el=document.createElement('div');
  el.className=`event-toast ${type}`;
  el.textContent=text;
  c.appendChild(el);
  setTimeout(()=>el.remove(),3500);
  // Limit visible toasts
  while(c.children.length>4) c.firstChild.remove();
}

function clearToasts(){
  shownToasts.clear();
  document.getElementById('toastContainer').innerHTML='';
}

// Tire compound colors for canvas
const TIRE_COLORS={SOFT:'#E10600',MEDIUM:'#FFD700',HARD:'#E8E8EC',INTERMEDIATE:'#00C853',WET:'#00B0FF'};

async function fetchReplayData(){
  try{
    // Find latest completed race session
    let sessionKey=null,sessInfo=null;
    for(const year of[2026,2025]){
      const r=await fetch(`https://api.openf1.org/v1/sessions?session_type=Race&year=${year}`);
      if(!r.ok) continue;
      const sessions=await r.json();
      const now=Date.now();
      const completed=sessions.filter(s=>s.date_end&&new Date(s.date_end).getTime()<now);
      if(completed.length){
        sessInfo=completed[completed.length-1];
        sessionKey=sessInfo.session_key;
        break;
      }
    }
    if(!sessionKey) return null;

    // Fetch with retry helper to handle 429 rate limiting
    async function fetchRetry(url,retries=2){
      for(let i=0;i<=retries;i++){
        const r=await fetch(url);
        if(r.ok) return r.json();
        if(r.status===429&&i<retries){await new Promise(ok=>setTimeout(ok,1500*(i+1)));continue;}
        return [];
      }
      return [];
    }

    // Fetch position first, then others with small delays to avoid 429
    const posArr=await fetchRetry(`https://api.openf1.org/v1/position?session_key=${sessionKey}`);
    if(!posArr.length) return null;
    await new Promise(ok=>setTimeout(ok,300));
    const [pitArr,stintArr]=await Promise.all([
      fetchRetry(`https://api.openf1.org/v1/pit?session_key=${sessionKey}`),
      fetchRetry(`https://api.openf1.org/v1/stints?session_key=${sessionKey}`)
    ]);
    await new Promise(ok=>setTimeout(ok,300));
    const rcArr=await fetchRetry(`https://api.openf1.org/v1/race_control?session_key=${sessionKey}`);

    // Compute time range
    const allTimes=posArr.map(p=>new Date(p.date).getTime());
    const startT=Math.min(...allTimes),endT=Math.max(...allTimes);
    const totalDuration=endT-startT||1;
    const toT=ms=>(ms-startT)/totalDuration;

    // Pre-populate state: scan all position data to find all drivers and their initial positions
    const state={};
    posArr.forEach(p=>{state[p.driver_number]=p.position;});
    // Save final state, then reset and rebuild with full initial grid
    const finalState={...state};
    // Find the initial grid (first occurrence of each driver)
    const initState={};
    posArr.forEach(p=>{if(!initState[p.driver_number])initState[p.driver_number]=p.position;});

    // Rebuild snapshots with all drivers present from the start
    Object.assign(state,initState);
    const snapshots=[];
    let lastSnapTime=-Infinity;
    const minGap=totalDuration/300;

    // First snapshot: starting grid
    const gridPositions=Object.entries(initState).map(([num,pos])=>({num:parseInt(num),pos})).sort((a,b)=>a.pos-b.pos);
    snapshots.push({t:0,positions:gridPositions});

    // Replay through position changes
    const state2={...initState};
    posArr.forEach(p=>{
      state2[p.driver_number]=p.position;
      const pTime=new Date(p.date).getTime();
      if(pTime-lastSnapTime>=minGap){
        snapshots.push({
          t:toT(pTime),
          positions:Object.entries(state2).filter(([_,pos])=>pos).map(([num,pos])=>({num:parseInt(num),pos})).sort((a,b)=>a.pos-b.pos)
        });
        lastSnapTime=pTime;
      }
    });
    const finalPositions=Object.entries(finalState).filter(([_,pos])=>pos).map(([num,pos])=>({num:parseInt(num),pos})).sort((a,b)=>a.pos-b.pos);
    if(!snapshots.length||snapshots[snapshots.length-1].t<1) snapshots.push({t:1,positions:finalPositions});

    // Build pit stop events [{t, num, compound, duration}]
    const pits=pitArr.map(p=>{
      const d=driverByNum(p.driver_number);
      let dur=p.pit_duration;
      if(dur&&dur>100) dur=dur/1000; // likely milliseconds
      return {
        t:toT(new Date(p.date).getTime()),
        num:p.driver_number,
        name:d?d.a:`#${p.driver_number}`,
        duration:dur?dur.toFixed(1):null
      };
    }).filter(p=>p.t>=0&&p.t<=1);

    // Build stint data (tire compounds per driver over time)
    // stintArr: [{driver_number, lap_start, lap_end, compound, ...}]
    const stints={};
    stintArr.forEach(s=>{
      if(!stints[s.driver_number]) stints[s.driver_number]=[];
      stints[s.driver_number].push({
        lapStart:s.lap_start||0,
        lapEnd:s.lap_end||999,
        compound:(s.compound||'').toUpperCase()
      });
    });

    // Build race control events [{t, type, msg}]
    const flags=[];
    const dnfDrivers=new Set();
    rcArr.forEach(rc=>{
      const t=toT(new Date(rc.date).getTime());
      if(t<0||t>1) return;
      const msg=rc.message||'';
      const cat=rc.category||'';
      const flag=rc.flag||'';

      if(flag==='YELLOW'||cat==='Flag'&&msg.includes('YELLOW')){
        flags.push({t,type:'yellow',msg:`🟡 黃旗${rc.sector?` S${rc.sector}`:''}`});
      } else if(flag==='RED'||msg.includes('RED FLAG')){
        flags.push({t,type:'red',msg:'🔴 紅旗 — 比賽暫停'});
      } else if(flag==='GREEN'&&msg.includes('CLEAR')){
        flags.push({t,type:'green',msg:'🟢 綠旗 — 恢復比賽'});
      } else if(msg.includes('SAFETY CAR')||cat==='SafetyCar'){
        if(msg.includes('VIRTUAL')){
          flags.push({t,type:'sc',msg:'🟡 VSC 虛擬安全車'});
        } else {
          flags.push({t,type:'sc',msg:'🟡 安全車出動'});
        }
      } else if(msg.includes('RETIRED')||msg.includes('STOPPED')){
        const numMatch=msg.match(/(\d+)/);
        if(numMatch) dnfDrivers.add(parseInt(numMatch[1]));
        const d=numMatch?driverByNum(parseInt(numMatch[1])):null;
        flags.push({t,type:'dnf',msg:`❌ ${d?d.a:'#'+numMatch?.[1]} 退賽`});
      }
    });

    // Match to our race data
    let trackRound=1;
    const cn=(sessInfo.circuit_short_name||'').toLowerCase();
    const mn=(sessInfo.meeting_name||'').toLowerCase();
    const country=(sessInfo.country_name||'').toLowerCase();
    for(const r of RACES){
      const rc=r.circuit.toLowerCase(),rl=r.loc.toLowerCase();
      if(rc.includes(cn)||cn.includes(rc.split(' ')[0])||mn.includes(rl)||r.name.includes(sessInfo.country_name||'XXXX')){
        trackRound=r.round;break;
      }
    }
    const totalLaps=RACES.find(r=>r.round===trackRound)?.laps||55;
    const raceName=sessInfo.meeting_name||sessInfo.circuit_short_name||'上一場比賽';

    return {sessionName:raceName,snapshots,totalLaps,trackRound,finalPositions,pits,stints,flags,dnfDrivers};
  }catch(e){
    console.error('Replay fetch error:',e);
    return null;
  }
}

function getPositionsAtTime(t){
  if(!replayData||!replayData.snapshots.length) return DRIVERS.map((d,i)=>({num:d.n,pos:i+1}));
  let best=replayData.snapshots[0];
  for(const s of replayData.snapshots){
    if(s.t<=t) best=s; else break;
  }
  return best.positions;
}

function getTireAtLap(driverNum,lap){
  if(!replayData||!replayData.stints||!replayData.stints[driverNum]) return null;
  const stints=replayData.stints[driverNum];
  for(let i=stints.length-1;i>=0;i--){
    if(lap>=stints[i].lapStart) return stints[i].compound;
  }
  return stints[0]?.compound||null;
}

function getActiveFlag(t){
  if(!replayData||!replayData.flags) return null;
  let active=null;
  for(const f of replayData.flags){
    if(f.t>t) break;
    if(f.type==='yellow'||f.type==='red'||f.type==='sc') active=f;
    if(f.type==='green') active=null;
  }
  return active;
}

async function initTrack(){
  tCanvas=document.getElementById('trackCanvas');
  tCtx=tCanvas.getContext('2d');
  const box=tCanvas.parentElement;
  tCanvas.width=box.clientWidth*devicePixelRatio;
  tCanvas.height=box.clientHeight*devicePixelRatio;
  tCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

  document.getElementById('trackStatus').className='track-status off';
  document.getElementById('trackStatus').textContent='載入中...';
  document.getElementById('refreshDot').classList.remove('live');

  replayData=await fetchReplayData();

  if(replayData){
    const race=RACES.find(r=>r.round===replayData.trackRound)||RACES[0];
    document.getElementById('trackTitle').textContent=`${race.flag} ${replayData.sessionName} 回放`;
    document.getElementById('trackStatus').className='track-status on';
    document.getElementById('trackStatus').textContent='回放中';
    document.getElementById('refreshDot').classList.add('live');
    document.getElementById('replayBar').style.display='flex';
    startReplay(race);
  } else {
    const race=lastCompletedRace()||nextRace()||RACES[0];
    document.getElementById('trackTitle').textContent=`${race.flag} ${race.name}`;
    document.getElementById('trackStatus').textContent='模擬回放';
    document.getElementById('replayBar').style.display='flex';
    startFallbackReplay(race);
  }
}

function startReplay(race){
  if(animId)cancelAnimationFrame(animId);
  clearToasts();
  const pts=TRACKS[race.round]||TRACKS[1];
  const t0=performance.now();
  let lastLb=-1;

  function frame(ts){
    const elapsed=(ts-t0)/1000;
    const progress=(elapsed%REPLAY_DURATION)/REPLAY_DURATION;
    const lap=Math.min(Math.floor(progress*replayData.totalLaps)+1,replayData.totalLaps);

    // Reset toasts on loop
    if(progress<0.01&&shownToasts.size>0) clearToasts();

    // Progress bar
    document.getElementById('replayProgress').style.width=`${progress*100}%`;
    document.getElementById('replayTime').textContent=`Lap ${lap}`;
    document.getElementById('lapText').textContent=race.circuit;
    document.getElementById('lapNum').textContent=`${lap}/${replayData.totalLaps}`;

    // Show events
    replayData.pits.forEach((p,i)=>{
      if(progress>=p.t&&progress-p.t<0.005) showToast(`pit${i}`,`🔧 ${p.name} 進站${p.duration?` (${p.duration}s)`:''}`, 'pit');
    });
    replayData.flags.forEach((f,i)=>{
      if(progress>=f.t&&progress-f.t<0.005) showToast(`flag${i}`,f.msg,f.type);
    });

    // Flag overlay
    const activeFlag=getActiveFlag(progress);
    const overlay=document.getElementById('flagOverlay');
    overlay.className='flag-overlay'+(activeFlag?` ${activeFlag.type}`:'');

    // Positions + leaderboard (update every ~0.5s)
    const positions=getPositionsAtTime(progress);
    if(Math.floor(elapsed*2)!==lastLb){
      renderLeaderboard(positions,lap);
      lastLb=Math.floor(elapsed*2);
    }

    drawTrackFrame(tCtx,tCanvas,pts,positions,progress*replayData.totalLaps,lap);
    animId=requestAnimationFrame(frame);
  }
  animId=requestAnimationFrame(frame);
}

function startFallbackReplay(race){
  if(animId)cancelAnimationFrame(animId);
  clearToasts();
  const pts=TRACKS[race.round]||TRACKS[1];
  const t0=performance.now();
  const defaultPos=DRIVERS.map((d,i)=>({num:d.n,pos:i+1}));
  renderLeaderboard(defaultPos,1);

  function frame(ts){
    const elapsed=(ts-t0)/1000;
    const progress=(elapsed%REPLAY_DURATION)/REPLAY_DURATION;
    const lap=Math.min(Math.floor(progress*race.laps)+1,race.laps);

    document.getElementById('replayProgress').style.width=`${progress*100}%`;
    document.getElementById('replayTime').textContent=`Lap ${lap}`;
    document.getElementById('lapText').textContent=race.circuit;
    document.getElementById('lapNum').textContent=`${lap}/${race.laps}`;

    drawTrackFrame(tCtx,tCanvas,pts,defaultPos,progress*race.laps,lap);
    animId=requestAnimationFrame(frame);
  }
  animId=requestAnimationFrame(frame);
}

function drawTrackFrame(ctx,canvas,pts,positions,lapProgress,currentLap){
  const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;
  ctx.clearRect(0,0,w,h);

  const pad=36,tw2=w-pad*2,th=h-pad*2;
  ctx.beginPath();
  for(let i=0;i<=1;i+=.004){const[x,y]=getP(pts,i);i===0?ctx.moveTo(pad+x*tw2,pad+y*th):ctx.lineTo(pad+x*tw2,pad+y*th)}
  ctx.closePath();
  ctx.strokeStyle='#2A2A32';ctx.lineWidth=28;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  ctx.strokeStyle='#333';ctx.lineWidth=24;ctx.stroke();
  ctx.setLineDash([4,8]);ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);

  const[sx,sy]=getP(pts,0);
  ctx.fillStyle='#fff';ctx.fillRect(pad+sx*tw2-1.5,pad+sy*th-16,3,32);

  const leaderT=(lapProgress*0.15)%1;
  const isDNF=num=>replayData&&replayData.dnfDrivers&&replayData.dnfDrivers.has(num);

  positions.forEach(lp=>{
    const drv=driverByNum(lp.num);
    if(!drv)return;
    // Skip DNF drivers from track (they're parked)
    if(isDNF(lp.num)) return;
    const gap=(lp.pos-1)*0.032;
    const t=leaderT-gap;
    const[cx,cy]=getP(pts,t);
    const x=pad+cx*tw2,y=pad+cy*th;
    const col=TC[drv.t]||'#666';

    // Tire dot
    const tire=getTireAtLap(lp.num,currentLap);
    const tireCol=tire?TIRE_COLORS[tire]:null;

    ctx.save();
    const bw=32,bh=14,br=4;
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=4;
    ctx.beginPath();ctx.roundRect(x-bw/2,y-bh/2,bw,bh,br);ctx.fill();
    ctx.shadowBlur=0;
    ctx.font='bold 8px DM Sans,sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(drv.a,x,y);

    // Tire indicator dot
    if(tireCol){
      ctx.fillStyle=tireCol;
      ctx.beginPath();ctx.arc(x+bw/2-2,y-bh/2-2,3,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });
}

function renderLeaderboard(positions,currentLap){
  const isDNF=num=>replayData&&replayData.dnfDrivers&&replayData.dnfDrivers.has(num);

  document.getElementById('leaderboard').innerHTML=positions.map(lp=>{
    const d=driverByNum(lp.num);
    if(!d) return `<div class="lb-row">
      <div class="lb-pos">${lp.pos}</div>
      <div class="lb-color" style="background:#666"></div>
      <div class="lb-info"><div class="lb-name">#${lp.num}</div><div class="lb-team">-</div></div>
    </div>`;

    const pc=lp.pos<=3?` p${lp.pos}`:'';
    const tire=getTireAtLap(lp.num,currentLap||1);
    const dnf=isDNF(lp.num);
    const tireHTML=tire?`<div class="tire ${tire}" title="${tire}"></div>`:'';
    const dnfHTML=dnf?`<span class="dnf-tag">DNF</span>`:'';

    return `<div class="lb-row"${dnf?' style="opacity:0.4"':''}>
      <div class="lb-pos${pc}">${lp.pos}</div>
      <div class="lb-color" style="background:${TC[d.t]||'#666'}"></div>
      <div class="lb-info"><div class="lb-name">${d.a} ${d.name}</div><div class="lb-team">${d.t}</div></div>
      ${dnfHTML}${tireHTML}
    </div>`;
  }).join('');
}

// ==================== STANDINGS (Ergast API) ====================
let standingsCache=null;

async function loadStandings(){
  if(standingsCache){showStandings('driver');return}
  document.getElementById('standingsBody').innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">載入中...</div>';
  try{
    const r=await fetch('https://api.jolpi.ca/ergast/f1/current/driverstandings/?format=json');
    if(!r.ok) throw 0;
    const d=await r.json();
    standingsCache=d.MRData.StandingsTable.StandingsLists[0].DriverStandings;
    showStandings('driver');
  }catch(e){
    standingsCache=null;
    document.getElementById('standingsBody').innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">暫時無法載入積分榜</div>';
  }
}

function showStandings(type){
  document.querySelectorAll('.standings-toggle button').forEach((b,i)=>{
    b.classList.toggle('active',(type==='driver'&&i===0)||(type==='team'&&i===1));
  });
  const body=document.getElementById('standingsBody');
  if(!standingsCache){body.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">無資料</div>';return}

  if(type==='driver'){
    body.innerHTML=standingsCache.map((s,i)=>{
      const pos=i+1,pc=pos<=3?` p${pos}`:'';
      const tn=s.Constructors[0]?.name||'';
      return `<div class="st-row">
        <div class="st-pos${pc}">${s.position}</div>
        <div class="st-color" style="background:${TC[tn]||'#666'}"></div>
        <div class="st-info"><div class="st-driver">${s.Driver.givenName} ${s.Driver.familyName}</div><div class="st-team">${tn}${parseInt(s.wins)?` · ${s.wins} 勝`:''}</div></div>
        <div class="st-points">${s.points}<small> PTS</small></div>
      </div>`;
    }).join('');
  } else {
    const teams={};
    standingsCache.forEach(s=>{
      const tn=s.Constructors[0]?.name||'Unknown';
      if(!teams[tn])teams[tn]={t:tn,pts:0,w:0};
      teams[tn].pts+=parseFloat(s.points);teams[tn].w+=parseInt(s.wins);
    });
    const sorted=Object.values(teams).sort((a,b)=>b.pts-a.pts);
    body.innerHTML=sorted.map((s,i)=>{
      const pos=i+1,pc=pos<=3?` p${pos}`:'';
      return `<div class="st-row">
        <div class="st-pos${pc}">${pos}</div>
        <div class="st-color" style="background:${TC[s.t]||'#666'}"></div>
        <div class="st-info"><div class="st-driver">${s.t}</div><div class="st-team">${s.w} 勝</div></div>
        <div class="st-points">${s.pts}<small> PTS</small></div>
      </div>`;
    }).join('');
  }
}

// ==================== NOTIFICATIONS ====================
function toggleNotify(){
  const btn=document.getElementById('notifyBtn');
  if(!('Notification' in window)){alert('此瀏覽器不支援通知');return}
  if(localStorage.getItem('f1_notify')!=='true'){
    Notification.requestPermission().then(p=>{
      if(p==='granted'){
        localStorage.setItem('f1_notify','true');
        btn.style.background='var(--red)';btn.style.color='#fff';btn.style.borderColor='var(--red)';
        btn.textContent='通知已開啟';
        registerNotifyCheck();
      }
    });
  } else {
    localStorage.removeItem('f1_notify');
    btn.style.background='var(--surface2)';btn.style.color='var(--text2)';btn.style.borderColor='var(--border)';
    btn.textContent='開啟通知';
  }
}

function registerNotifyCheck(){
  checkAndNotify();setInterval(checkAndNotify,15*60000);
}

function checkAndNotify(){
  if(localStorage.getItem('f1_notify')!=='true')return;
  const now=Date.now();
  RACES.forEach(race=>{
    const rt=new Date(race.rt).getTime(),diff=rt-now,key=`f1_n_${race.round}`;
    if(diff>0&&diff<=65*60000&&diff>55*60000&&!localStorage.getItem(key+'_1h')){
      new Notification('🏁 F1 比賽 1 小時後開始！',{body:`${race.name}\n台灣時間 ${twT(race.rt)}`,tag:'f1'});
      localStorage.setItem(key+'_1h','1');
    }
  });
}

// ==================== INIT ====================
renderSchedule();
if(localStorage.getItem('f1_notify')==='true'){
  const btn=document.getElementById('notifyBtn');
  btn.style.background='var(--red)';btn.style.color='#fff';btn.style.borderColor='var(--red)';
  btn.textContent='通知已開啟';
  registerNotifyCheck();
}
// No auto-switch to track - user opens it manually

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
